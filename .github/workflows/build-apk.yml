name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MeteoPaysage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeteoPaysage
          path: MeteoPaysage.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Météo Paysage 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: MeteoPaysage.apk
          body: |
            Sur le Galaxy S22 : téléchargez **MeteoPaysage.apk**, ouvrez-le et autorisez l'installation.
            Puis appui long sur l'écran d'accueil ▸ Widgets ▸ Météo Paysage.
