name: Build APK

# Compile l'APK de développement dans le cloud, le publie dans une version GitHub
# (lien stable de téléchargement) et l'ajoute aux artefacts de l'exécution.
on:
  push:
    branches: [ccr-72ccecef-ea6v22]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        run: chmod +x gradlew

      - name: Compiler l'APK de développement
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Nommer l'APK avec le numéro de compilation
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/studio-camera-compilation-${GITHUB_RUN_NUMBER}.apk"

      - name: Publier l'APK dans une version GitHub (lien stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "app/build/outputs/apk/debug/studio-camera-compilation-${GITHUB_RUN_NUMBER}.apk" studio-camera-latest.apk
          gh release create "compilation-${GITHUB_RUN_NUMBER}" studio-camera-latest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Compilation n° ${GITHUB_RUN_NUMBER}" \
            --notes "APK de développement (compilation n° ${GITHUB_RUN_NUMBER}). Sur le téléphone : ouvrir le fichier téléchargé et installer." \
            --latest

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-camera-compilation-${{ github.run_number }}
          path: app/build/outputs/apk/debug/studio-camera-compilation-*.apk
          if-no-files-found: error

      - name: Exécuter les tests unitaires
        run: ./gradlew :app:testDebugUnitTest --no-daemon
