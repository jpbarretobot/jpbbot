name: Test sur émulateur

on:
  push:
    paths:
      - app/**
      - .github/workflows/emulator.yml
      - tools/emulator_test.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Lancer l'appli sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator_test.sh
      - name: Enregistrer les résultats (branche test-results)
        if: always()
        run: |
          cp -r test_output /tmp/test_output
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan test-results
          git rm -rfq . && git clean -fdq
          cp -r /tmp/test_output .
          git add -f test_output
          git commit -qm "Résultats du test sur émulateur ($GITHUB_SHA)"
          git push -f origin test-results
