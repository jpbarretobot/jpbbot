<!doctype html><html><body style="margin:0"><script src="scene.js"></script><script>
const W = 1080, H = 2340;
const HOME = { seed: 11, horizon: 0.5, sunX: 0.7, boat: 0.82, pierX: 0.42, pierY: 0.07, ground: 0.2, lamps: [[0.9, 0.24]] };
const LOCK = { seed: 23, horizon: 0.44, sunX: 0.78, boat: 0.66, pierX: 0.45, pierY: 0.06, ground: 0.18, lamps: [[0.88, 0.3], [0.62, 0.17]], figure: [0.26, 0.8, 1.3] };
function render(o, w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; scene(c.getContext('2d'), w, h, o); return c; }
window.wall = (which, type = 'image/png', q) => render(which === 'lock' ? LOCK : HOME).toDataURL(type, q);
window.ico = (n, s, size) => icon(n, s, size).toDataURL('image/png');
window.names = () => Object.keys(GLYPHS);
// animated lock: static base + drifting fog, rain, lamp flicker
let base;
window.animFrame = (t, T) => {
  if (!base) base = render(LOCK);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.drawImage(base, 0, 0);
  const k = t / T * Math.PI * 2, hy = H * LOCK.horizon;
  for (let i = 0; i < 3; i++) { const y = hy + H * (0.02 + i * 0.05), dx = ((t / T) * W * (i + 1)) % W;
    for (const off of [-W, 0]) { const g = x.createRadialGradient(dx + off + W / 2, y, 0, dx + off + W / 2, y, W * 0.6);
      g.addColorStop(0, `rgba(240,170,90,${0.16 - i * 0.03})`); g.addColorStop(1, 'rgba(240,170,90,0)');
      x.save(); x.translate(0, y); x.scale(1, 0.18); x.translate(0, -y); x.fillStyle = g; x.fillRect(0, y - W, W, W * 2); x.restore(); } }
  let s = 99; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  x.strokeStyle = 'rgba(255,215,160,.22)'; x.lineWidth = 2;
  x.beginPath();
  for (let i = 0; i < 260; i++) { const x0 = r() * W, speed = 3 + (r() * 3 | 0), y0 = ((r() + speed * t / T) % 1) * (H + 200) - 100, l = 30 + r() * 50;
    x.moveTo(x0, y0); x.lineTo(x0 - l * 0.12, y0 + l); }
  x.stroke();
  const flick = 0.06 * (Math.sin(k * 7) + Math.sin(k * 13 + 1)) ;
  x.fillStyle = `rgba(255,190,110,${Math.max(0, flick)})`; x.fillRect(0, 0, W, H);
  return c.toDataURL('image/jpeg', 0.92);
};
</script></body></html>
